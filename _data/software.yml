- name: DOME
  category: Geohazard assessment
  description: Regional debris-flow susceptibility assessment combining dynamic learner selection,
    metaheuristic optimization, stacked ensembles and SHAP interpretation.
  tags:
  - Ensemble learning
  - Interpretation
  links:
  - label: Repository
    url: https://github.com/zjusuge/DOME_Dynamic-Optimization-Meta-Ensemble-Framework-for-Computational-Debris-Flow-Risk-Assessment
  - label: Paper
    url: https://doi.org/10.1007/s11069-026-08307-2
  - label: Archive
    url: https://doi.org/10.5281/zenodo.16911533
- name: TabPFNv2.5-DebrisFlow
  category: Small-sample prediction
  description: Small-sample debris-flow volume prediction with TabPFN-2.5, sediment-source information,
    machine-learning comparisons and regional holdout evaluation.
  tags:
  - Tabular learning
  - Benchmarking
  links:
  - label: Repository
    url: https://github.com/zjusuge/TabPFNv2.5-DebrisFlow
- name: RSRL-HU
  category: Landslide forecasting
  description: One-day-ahead landslide velocity forecasting combining robust motion-state estimation,
    groundwater forecasts, hydrology-informed residual learning and sequential prediction intervals.
  tags:
  - Hydrology-informed learning
  - Uncertainty quantification
  links:
  - label: Repository
    url: https://github.com/zjusuge/RSRL-HU
- name: Hydrological Readiness Forecasting
  category: Early-warning support
  description: Calibrated probabilities of warning-relevant hydrological states over the next three days
    in small catchments, with chronological evaluation and optional SHAP attribution.
  tags:
  - Probabilistic forecasting
  - Hydrological states
  links:
  - label: Repository
    url: https://github.com/zjusuge/hydrological-readiness-forecasting
- name: BWSD
  category: Catchment hydrology
  description: Daily Basin Water Storage Degree calculation and hydrological-state classification
    from the Fengshuwan catchment water balance.
  tags:
  - Water storage
  - Case study
  links:
  - label: Repository
    url: https://github.com/zjusuge/bwsd-fengshuwan-case
- name: HydroPIML-RS
  category: Hydrological prediction
  description: Physics-informed residual stacking for short-lead runoff and water-stage forecasting,
    with prediction replay and documented revision evidence for the Fengshuwan catchment.
  tags:
  - Physics-informed learning
  - Runoff and water stage
  links:
  - label: Repository
    url: https://github.com/zjusuge/hydropiml-rs-fengshuwan-case
