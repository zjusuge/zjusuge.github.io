profile: >-
  I develop physics-informed and explainable machine-learning methods for debris-flow,
  landslide and hydrological prediction. My research combines catchment storage and
  hydrological memory with residual learning, ensemble optimization and uncertainty
  analysis, with particular attention to small catchments and sparse observations.
  I seek to extend these methods to related problems in hydrology, geotechnics and
  engineering monitoring through interdisciplinary collaboration.
strengths:
  - title: Physics-informed prediction
    text: Water-balance reasoning, hydrological memory and physical consistency constraints for runoff, water-stage and landslide forecasts.
  - title: Explainable AI and algorithm development
    text: Ensemble learning, metaheuristic optimization, SHAP analysis and pretrained tabular models for geohazard assessment and sparse-data prediction.
  - title: Evaluation and uncertainty
    text: Chronological and spatial evaluation, robust state estimation and sequential prediction intervals.
technical_skills:
  - category: Programming and research software
    text: Python; MATLAB; data analysis, model implementation and GitHub-based research code sharing.
  - category: Machine learning and optimization
    text: Residual and stacking ensembles; metaheuristic optimization; generative learning; pretrained tabular models.
  - category: Process-informed modelling
    text: Catchment water balance; hydrological memory; groundwater response; robust motion-state estimation.
  - category: Interpretation and evaluation
    text: SHAP analysis; temporal and spatial evaluation; prediction intervals; small-sample benchmarking.
  - category: Scientific communication
    text: English-language publications and research collaboration; two-year CSC-supported research visit at NTU.
