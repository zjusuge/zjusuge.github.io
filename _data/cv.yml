profile: I develop physics-informed and explainable machine-learning methods for debris-flow, landslide
  and hydrological prediction. My research combines hydrological reasoning, residual learning, ensemble
  optimization and uncertainty analysis, with an emphasis on small catchments and sparse observations.
strengths:
- title: Physics-informed prediction
  text: Water-balance reasoning, hydrological memory and physical consistency constraints for runoff,
    water-stage and landslide forecasts.
- title: Explainable AI and algorithm development
  text: Ensemble learning, metaheuristic optimization, SHAP analysis and pretrained tabular models for
    geohazard assessment and sparse-data prediction.
- title: Evaluation and uncertainty
  text: Chronological and spatial evaluation, robust state estimation and sequential prediction intervals.
