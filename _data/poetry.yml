publication_note: 《苏格尼兰》出版于 2025 年，收录了我从 2018 年至 2024 年的诗作。第二部诗集《苏格未来》（暂名）正在写作中。往后，希望每隔五年左右，将沿途的风景与心事结成一册，与时光、与自己对话，也与愿意翻开诗集的你重逢。
