intro: 我从十八岁开始写诗，也从事地质灾害与水文过程的研究。山川与水既是研究的对象，也是诗意的来处。那些走过的路、见过的人，青春里的热忱与迷惘，渐渐落成纸上的字句。我以诗记录生活的点滴、自然的律动与时代的呼吸，也在书写中凝视世界，聆听内心。愿这些出发于个人生命的诗行，能与你的某一段岁月相逢。
