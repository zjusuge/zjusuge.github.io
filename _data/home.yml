hero:
  eyebrow: Geohazards · Hydrology · Physics-informed AI
  headline: Catchment processes.
  subheadline: Geohazard prediction.
  intro_before: I develop
  intro_focus: physics-informed and explainable prediction methods
  intro_after: ' for debris flows, landslides and hydrology, connecting field observations,
    catchment storage and hydrological memory with short-lead forecasting.'
research:
  title: From observations to prediction.
  intro: 'Small catchments and sparse observations connect three strands of my research.'
  topics:
  - letter: '01'
    color: blue
    category: Observe & understand
    title: Catchment states & memory
    description: Field monitoring and water-balance analysis connect rainfall, groundwater response
      and catchment storage to hydrological-state assessment.
    link: '#current-research'
    link_label: Current research
  - letter: '02'
    color: teal
    category: Forecast & explain
    title: Physics-informed & explainable learning
    description: Physics-informed learning, ensembles and optimization support sparse-data prediction,
      with SHAP interpretation, prediction intervals and temporal or spatial evaluation.
    link: '#selected-work'
    link_label: Selected work
  - letter: '03'
    color: clay
    category: Assess & mitigate
    title: Hydrology & hazard mitigation
    description: Collaborative work on siphon drainage, slope stabilization and geotechnical modelling
      connects hydrological understanding with practical hazard mitigation.
    link: '#paper-anchor-siphon'
    link_label: Mitigation research
selected:
- paper_id: paper-bwsd
  number: '01'
  category: Catchment hydrology & warning support
  title: Understanding catchment storage for warning support.
  summary: Basin Water Storage Degree (BWSD) provides a sequential water-balance indicator of apparent
    catchment storage for warning support, evaluated with 908 daily observations in a small mountain catchment.
  venue: International Journal of Disaster Risk Reduction · 146, 106496 · 2026
  detail: Apparent storage + archived data + reproducible code
- paper_id: paper-source-volume
  number: '02'
  category: Physics-informed learning
  title: Learning from limited debris-flow inventories.
  summary: GAMMA combines conditional diffusion, multimodal learning and a physics-guided regularizer
    to estimate post-seismic debris-flow source volumes.
  venue: Georisk · 2026
  detail: Physical constraints + generative learning
  figure: /images/research/gamma-physics.jpeg
  figure_caption: Physics-guided constraint embedding · Fig. 5
  figure_alt: Physics-guided regularization linking learned source-volume estimates and physical constraints.
- paper_id: paper-velocity
  number: '03'
  category: Debris-flow dynamics
  title: Predicting velocity. Explaining the drivers.
  summary: A multi-strategy stacking model estimates debris-flow velocity at Jiangjiagou, with SHAP analysis
    of feature contributions and interactions.
  venue: Journal of Hydrology · 2024
  detail: Ensemble prediction + model interpretation
  figure: /images/research/velocity-prediction.png
  figure_caption: Debris-flow velocity prediction · Fig. 10
  figure_alt: Published observed and predicted debris-flow velocities, including the labelled training
    and test partitions.
- paper_id: paper-dome
  number: '04'
  category: Regional susceptibility
  title: Mapping where attention is needed.
  summary: DOME combines dynamic ensemble selection, calibration and spatial evaluation for debris-flow
    susceptibility assessment along a mountain transport corridor.
  venue: Natural Hazards · 2026
  detail: Spatial assessment + open research code
  figure: /images/research/dome-workflow.png
  figure_caption: DOME computational workflow · Fig. 1
  figure_alt: DOME workflow showing learner selection, ensemble construction, calibration and evaluation.
ongoing:
- title: Hydrological readiness & catchment storage
  description: Building on the published Basin Water Storage Degree (BWSD) indicator to connect catchment
    storage assessment with readiness forecasts from rainfall, drainage and monitored conditions.
  boundary: Warning-support research; event-detection skill requires validation on debris-flow events
    and independent catchments.
  link: https://github.com/zjusuge/bwsd-fengshuwan-case
  link_label: BWSD case-study code
- title: Physics-guided runoff & stage forecasting
  description: HydroPIML-RS combines hydrological memory, residual learning and physical consistency constraints
    for short-lead outlet forecasts.
  boundary: ''
  link: https://github.com/zjusuge/hydropiml-rs-fengshuwan-case
  link_label: HydroPIML-RS code
- title: Prediction with sparse observations
  description: Exploring tabular foundation models for debris-flow volume and hydrology-informed residual
    learning for landslide velocity, with prediction intervals.
  boundary: ''
  link: https://github.com/zjusuge/TabPFNv2.5-DebrisFlow
  link_label: Volume benchmark code
