hero:
  eyebrow: Geohazards · Hydrology · Physics-informed & explainable AI
  headline: Understanding processes.
  subheadline: Advancing geohazard prediction.
  intro_before: I develop
  intro_focus: physics-informed and explainable prediction methods
  intro_after: ' for hydrological processes and geohazards, especially debris flows and landslides. My
    research connects catchment storage and hydrological memory with short-lead forecasting, monitoring
    and mitigation.'
research:
  title: Forecasting at the intersection of physics and AI.
  intro: 'Prediction is the thread running through my work: from hydrological and groundwater response
    to debris-flow dynamics, landslide motion and hazard assessment.'
  topics:
  - letter: '01'
    color: blue
    category: Observe & understand
    title: What makes a catchment ready to respond?
    description: I use catchment and slope monitoring to study hydrological memory, rainfall–groundwater
      coupling and storage-state indicators that inform geohazard forecasting.
    methods:
    - Field monitoring
    - Hydrological memory
    - Water storage
    link: '#current-research'
    link_label: Current research
  - letter: '02'
    color: teal
    category: Forecast & explain
    title: How can physics improve predictions?
    description: I develop PIML, XAI, ensemble learning and optimization methods for spatial hazard assessment
      and temporal forecasts of flow, water levels and slope movement.
    methods:
    - PIML & XAI
    - Algorithm development
    - Spatiotemporal prediction
    link: '#selected-work'
    link_label: Selected work
  - letter: '03'
    color: clay
    category: Assess & mitigate
    title: How can predictions inform intervention?
    description: Collaborative work on siphon drainage, slope stabilization and geotechnical modelling
      connects hydrological understanding with practical hazard mitigation.
    methods:
    - Siphon drainage
    - Slope stabilization
    - Numerical modelling
    link: '#paper-anchor-siphon'
    link_label: Mitigation research
selected:
- paper_id: paper-bwsd
  number: '01'
  category: Catchment hydrology & warning support
  title: Understanding catchment storage for warning support.
  summary: Basin Water Storage Degree (BWSD) provides a water-balance indicator of antecedent catchment
    storage, tested as a forward-looking proof of concept in a small mountain catchment.
  venue: International Journal of Disaster Risk Reduction · Accepted October 2026
  detail: Hydrological state indicator + open research code
- paper_id: paper-source-volume
  number: '02'
  category: Physics-informed learning
  title: Learning from limited debris-flow inventories.
  summary: GAMMA combines conditional diffusion, multimodal learning and a physics-guided regularizer
    to estimate post-seismic debris-flow source volumes.
  venue: Georisk · 2026
  detail: Physical constraints + generative learning
  figure: /images/research/gamma-physics.jpeg
  figure_caption: Physics-guided constraint embedding · Fig. 5
  figure_alt: Physics-guided regularization linking learned source-volume estimates and physical constraints.
- paper_id: paper-velocity
  number: '03'
  category: Debris-flow dynamics
  title: Predicting velocity. Explaining the drivers.
  summary: A multi-strategy stacking model estimates debris-flow velocity at Jiangjiagou, with SHAP analysis
    of feature contributions and interactions.
  venue: Journal of Hydrology · 2024
  detail: Ensemble prediction + model interpretation
  figure: /images/research/velocity-prediction.png
  figure_caption: Debris-flow velocity prediction · Fig. 10
  figure_alt: Published observed and predicted debris-flow velocities, including the labelled training
    and test partitions.
- paper_id: paper-dome
  number: '04'
  category: Regional susceptibility
  title: Mapping where attention is needed.
  summary: DOME combines dynamic ensemble selection, calibration and spatial evaluation for debris-flow
    susceptibility assessment along a mountain transport corridor.
  venue: Natural Hazards · 2026
  detail: Spatial assessment + open research code
  figure: /images/research/dome-workflow.png
  figure_caption: DOME computational workflow · Fig. 1
  figure_alt: DOME workflow showing learner selection, ensemble construction, calibration and evaluation.
